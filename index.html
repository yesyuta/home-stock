<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Stock</title>
<meta name="theme-color" content="#f0708f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Stock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: two tabs at the thumb — "To buy" (a shared checklist) and "Stock" (a picture grid). Every item opens one sheet with two big actions. */
:root{
  --bg:#fff6f1; --surface:#ffffff; --ink:#4b3552; --muted:#8e7894; --line:#f3e2e6;
  --accent:#f0708f; --accent-ink:#ffffff; --accent-soft:#ffe4ec;
  --due:#e4566b; --due-soft:#ffe1e4; --soon:#d98a10; --soon-soft:#fff0cf; --ok:#2f9e7f; --ok-soft:#dcf5ec;
  --c-baby:#ffd6e3; --c-kitchen:#ffe9c7; --c-bath:#d6ecff; --c-laundry:#e4dcff; --c-food:#d9f3dc; --c-other:#efe7ea;
  --shadow:0 2px 0 rgba(240,112,143,.12),0 10px 28px rgba(120,60,90,.08);
  --f-display:"Fredoka","M PLUS Rounded 1c","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,-apple-system,sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211922; --surface:#2d232f; --ink:#f8eaf2; --muted:#b9a2b9; --line:#3d3040;
  --accent:#ff93ad; --accent-ink:#2a1420; --accent-soft:#4a2a38;
  --due:#ff8a99; --due-soft:#47242b; --soon:#f4bd55; --soon-soft:#3f3118; --ok:#72d6b4; --ok-soft:#1d3a32;
  --c-baby:#4a2a38; --c-kitchen:#45361f; --c-bath:#24384a; --c-laundry:#332c4a; --c-food:#24402a; --c-other:#3a3038;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211922; --surface:#2d232f; --ink:#f8eaf2; --muted:#b9a2b9; --line:#3d3040;
  --accent:#ff93ad; --accent-ink:#2a1420; --accent-soft:#4a2a38;
  --due:#ff8a99; --due-soft:#47242b; --soon:#f4bd55; --soon-soft:#3f3118; --ok:#72d6b4; --ok-soft:#1d3a32;
  --c-baby:#4a2a38; --c-kitchen:#45361f; --c-bath:#24384a; --c-laundry:#332c4a; --c-food:#24402a; --c-other:#3a3038;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent);margin:0;flex:1;line-height:1.1}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}
.round.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(110px + env(safe-area-inset-bottom,0px))}
.lead{margin:2px 0 14px;color:var(--muted);font-size:13.5px}
.sec-h{font-family:var(--f-display);font-weight:600;font-size:17px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}

/* shopping list */
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 10px 10px 12px;transition:opacity .3s,transform .3s}
.lrow.done{opacity:0;transform:translateX(30px)}
.lmain{background:none;border:0;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px}
.lmain b{font-weight:800;font-size:16.5px;line-height:1.3}
.why{font-size:13px;font-weight:700}
.why.need{color:var(--due)} .why.due{color:var(--due)} .why.soon{color:var(--soon)}
.check{width:54px;height:54px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent)}
.check svg{width:26px;height:26px;opacity:.25}
.check:active,.lrow.done .check{background:var(--accent);color:var(--accent-ink)}
.lrow.done .check svg{opacity:1}
.soonlist .lrow{background:transparent;border-style:dashed}
.ico{width:52px;height:52px;border-radius:18px;background:var(--cat,var(--c-other));display:grid;place-items:center;flex:none}
.ico svg{width:46px;height:46px;overflow:visible}
.emptybox{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.emptybox b{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--ink)}
.emptybox .ico{width:84px;height:84px;border-radius:28px}.emptybox .ico svg{width:74px;height:74px}
.pill-btn{border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:99px;padding:10px 16px;font-weight:800;font-size:14px}

/* stock grid */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:800;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.card .ico{width:60px;height:60px;border-radius:20px}.card .ico svg{width:52px;height:52px}
.cname{font-weight:800;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;overflow-wrap:anywhere}
.cstat{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;white-space:nowrap}
.cstat.ok{background:var(--ok-soft);color:var(--ok)} .cstat.soon{background:var(--soon-soft);color:var(--soon)}
.cstat.due,.cstat.need{background:var(--due-soft);color:var(--due)} .cstat.none{background:var(--line);color:var(--muted)}
.gauge{width:80%;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:6px}
.gauge i.ok{background:var(--ok)} .gauge i.soon{background:var(--soon)} .gauge i.due,.gauge i.need{background:var(--due)}
.card:focus-visible,.lmain:focus-visible,.check:focus-visible,.chip:focus-visible,.round:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12.5px;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--due);color:#fff;font-family:var(--f-num);font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,15,30,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;max-height:88%;overflow:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;align-items:center;gap:14px}
.sh-head .ico{width:76px;height:76px;border-radius:26px}.sh-head .ico svg{width:68px;height:68px}
.sh-head h3{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0;line-height:1.2;flex:1;min-width:0}
.say{font-size:16px;font-weight:700;margin:0;line-height:1.45}
.say small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.big{width:100%;border:0;border-radius:20px;padding:16px;font-family:var(--f-display);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.big svg{width:24px;height:24px}
.big.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,var(--ink))}
.big.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,var(--ink))}
.big.second{background:var(--due-soft);color:var(--due)}
.big.second.on{background:var(--due);color:#fff}
.ask{background:var(--accent-soft);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ask p{margin:0;font-weight:800}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px}
.qchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details{border-top:2px dashed var(--line);padding-top:10px}
summary{font-weight:800;color:var(--muted);cursor:pointer;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.more{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:9px 10px}
.stat b{display:block;font-family:var(--f-num);font-weight:600;font-size:20px}
.stat span{font-size:11.5px;color:var(--muted)}
.inline{display:grid;grid-template-columns:1fr 76px auto;gap:8px;align-items:end}
label{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px;min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.small-btn{border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:800}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist .m{color:var(--muted);font-size:13px}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:6px}
.danger{background:none;border:2px solid var(--due);color:var(--due);border-radius:14px;padding:10px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font-weight:800;font-size:13px;padding:8px 16px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:99px;padding:11px 18px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline;padding:0}
.ro{background:var(--soon-soft);color:var(--soon);border-radius:18px;padding:10px 14px;font-size:13px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.lrow{transition:none}}

/* login */
.login{max-width:380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(48px + env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
.login h1{font-family:var(--f-display);font-weight:700;font-size:32px;color:var(--accent);margin:0}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:8px}
.login .sub{color:var(--muted);font-size:13px;margin:0}
.login form{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow)}
.login .buy{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:12px;font-family:var(--f-display);font-weight:600;font-size:16px}
.err{color:var(--due);font-size:13px;margin:0}
.foot{display:flex;justify-content:center}
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true" style="width:84px;height:84px"><path d="M18 26 L26 10" stroke="var(--muted)" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M46 26 L38 10" stroke="var(--muted)" stroke-width="3.5" stroke-linecap="round" fill="none"/><rect x="14" y="16" width="11" height="14" rx="3" fill="var(--c-bath)" transform="rotate(-12 19 23)"/><circle cx="34" cy="20" r="7" fill="var(--c-food)"/><rect x="39" y="14" width="9" height="16" rx="4" fill="var(--c-laundry)" transform="rotate(10 43 22)"/><path d="M8 26 H56 L50 54 Q49 57 46 57 H18 Q15 57 14 54 Z" fill="var(--accent)"/><path d="M32 50 C24 44 25 38 29 38 C31 38 32 40 32 40 C32 40 33 38 35 38 C39 38 40 44 32 50 Z" fill="var(--accent-ink)"/></svg>
    <h1>Home Stock</h1>
  </div>
  <p class="sub" data-i18n="loginLead"></p>
  <form id="loginForm" autocomplete="on">
    <label><span data-i18n="email"></span><input id="lEmail" type="email" autocomplete="username" required></label>
    <label><span data-i18n="password"></span><input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" hidden></p>
    <button class="buy" type="submit" data-i18n="signIn"></button>
  </form>
  <div class="foot"><div class="lang" role="group" aria-label="Language"><button data-lang="en" class="lbtn">EN</button><button data-lang="ja" class="lbtn">日本語</button></div></div>
</div>


<div id="appView" hidden>
  <div class="top"><div class="top-in">
    <h1 id="title"></h1>
    <button class="round add" id="addBtn" aria-label="Add item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="round" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div></div>

  <main>
    <div class="ro" id="ro" hidden></div>
    <section id="listView"></section>
    <section id="stockView" hidden></section>
  </main>

  <nav class="tabs"><div class="tabs-in" role="tablist">
    <button class="tab" role="tab" id="tabList" data-tab="list" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 10.5a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 2-1.6L21 8H6.2"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>
      <span data-i18n="tabList"></span><span class="badge num" id="badge" hidden></span>
    </button>
    <button class="tab" role="tab" id="tabStock" data-tab="stock" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tabStock"></span>
    </button>
  </div></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script type="module">

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db=null,me=null,meName="",canWrite=true;
let items=[],purchases=[],names={},openId=null,confirmDel=false,tab="list",catFilter="all";
let addCat="Baby",addDays=30;

const STR={

/* ---- 予測：購入間隔（1個あたり日数）を、新しいものほど重く加重平均 ---- */
function predict(it){
  const ps=purchases.filter(p=>p.itemId===it.id).sort((a,b)=>a.at-b.at);
  const last=ps[ps.length-1];
  let cycle=null,learned=0;
  if(ps.length>=2){
    let sw=0,s=0,w=1;
    for(let k=ps.length-1;k>=1;k--){
      const days=(ps[k].at-ps[k-1].at)/DAY/(ps[k-1].qty||1);
      if(days>0.5){s+=days*w;sw+=w;learned++;}
      w*=0.7;
    }
    if(sw>0)cycle=s/sw;
  }
  if(cycle==null&&it.guessDays)cycle=+it.guessDays;
  const r={ps,last,cycle,learned,status:"none",dueIn:null,frac:null,next:null};
  if(last){
    r.since=Math.floor((today0()-new Date(last.at).setHours(0,0,0,0))/DAY);
    if(cycle){
      const exp=cycle*(last.qty||1);
      r.dueIn=Math.round(exp-r.since);
      r.frac=Math.max(0,Math.min(1,1-r.since/exp));
      r.next=last.at+exp*DAY;
      r.status=r.dueIn<=0?"due":(r.dueIn<=Math.max(3,exp*0.2)?"soon":"ok");
    }
  }
  if(it.needed)r.status="need";
  return r;
}
function shortStatus(it,r){
  if(r.status==="need")return t("ranOutBy",it.neededByName||"");
  if(r.status==="none")return t("whenQ");
  if(r.dueIn==null)return "";
  if(r.dueIn<0)return t("overdue",-r.dueIn);
  if(r.dueIn===0)return t("dueToday");
  return t("left",r.dueIn);
}

  return `<div class="lrow" data-row="${it.id}">${icon(it)}
    <button class="lmain" data-open="${it.id}"><b>${esc(nm(it))}</b><span class="why ${cls}">${esc(shortStatus(it,r))}</span></button>
    ${canWrite?`<button class="check" data-tick="${it.id}" aria-label="${esc(t("tickAria",nm(it)))}">${CHECK}</button>`:""}
  </div>`;
}
function renderList(rs){
  const need=rs.filter(([,r])=>r.status==="need"||r.status==="due").sort((a,b)=>(a[1].status==="need"?-1:0)-(b[1].status==="need"?-1:0)||(a[1].dueIn??0)-(b[1].dueIn??0));
  const soon=rs.filter(([,r])=>r.status==="soon").sort((a,b)=>a[1].dueIn-b[1].dueIn);
  $("badge").textContent=need.length;$("badge").hidden=!need.length;
  let h=`<p class="lead">${t("listLead")}</p>`;
  if(need.length){
    h+=`<div class="sec-h">${t("needNow")} <span class="num">${need.length}</span></div><div class="list">${need.map(([i,r])=>lrow(i,r)).join("")}</div>`;
  }else{
    const star={id:"_",cat:"Other"};
    h+=`<div class="emptybox">${icon(star)}<b>${t("emptyListT")}</b><span>${t("emptyListS")}</span></div>`;
  }
  if(soon.length)h+=`<div class="sec-h">${t("soonH")} <small>${t("soonSub")}</small></div><div class="list soonlist">${soon.map(([i,r])=>lrow(i,r)).join("")}</div>`;
  if(canWrite)h+=`<div style="display:flex;justify-content:center;margin-top:18px"><button class="pill-btn" id="toStock">＋ ${t("addToList")}</button></div>`;
  $("listView").innerHTML=h;
}

}
function renderStock(rs){
  const present=CATS.filter(c=>items.some(i=>(i.cat||"Other")===c));
  if(catFilter!=="all"&&!present.includes(catFilter))catFilter="all";
  const order={need:0,due:1,soon:2,none:3,ok:4};
  const list=rs.filter(([i])=>catFilter==="all"||(i.cat||"Other")===catFilter)
    .sort((a,b)=>order[a[1].status]-order[b[1].status]||(a[1].dueIn??999)-(b[1].dueIn??999)||nm(a[0]).localeCompare(nm(b[0]),LANG));
  $("stockView").innerHTML=`<p class="lead">${t("stockLead")}</p>
    <div class="chips" role="group"><button class="chip" data-cat="all" aria-pressed="${catFilter==="all"}">${t("all")}</button>${present.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${catFilter===c}">${catName(c)}</button>`).join("")}</div>
    <div class="grid">${list.map(([i,r])=>card(i,r)).join("")}</div>`;
}
function render(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.title=t("title");$("title").textContent=t("title");
  $("tabList").setAttribute("aria-selected",tab==="list");$("tabStock").setAttribute("aria-selected",tab==="stock");
  $("listView").hidden=tab!=="list";$("stockView").hidden=tab!=="stock";
  $("addBtn").hidden=!canWrite;
  if(!db)return;
  const rs=items.map(it=>[it,predict(it)]);
  renderList(rs);renderStock(rs);
  if(openId)renderSheet();
}

/* ---- シート ---- */
function openSheet(id){openId=id;confirmDel=false;$("scrim").hidden=false;$("sheet").hidden=false;renderSheet();$("sheet").scrollTop=0;}
function closeSheet(){openId=null;$("scrim").hidden=true;$("sheet").hidden=true;}
function closeBtn(){return `<button class="round" data-close aria-label="${t("close")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;}
function renderSheet(){
  if(openId==="__add")return renderAdd();
  if(openId==="__menu")return renderMenu();
  const it=items.find(i=>i.id===openId); if(!it){closeSheet();return;}
  const r=predict(it);
  let say;
  if(r.status==="need")say=`<p class="say">${esc(t("sayNeed",it.neededByName||""))}</p>`;
  else if(!r.last)say=`<p class="say">${t("sayNone")}<small>${t("sayNoneSub")}</small></p>`;
  else if(r.dueIn!=null&&r.dueIn>0)say=`<p class="say">${t("sayLeft",r.dueIn)}<small>${t("sayLeftSub",fmtD(r.next))}</small></p>`;
  else if(r.dueIn===0)say=`<p class="say">${t("sayDue")}</p>`;
  else if(r.dueIn!=null)say=`<p class="say">${t("sayOver",-r.dueIn)}</p>`;
  else say="";
  const hist=[...r.ps].reverse();
  const ask=(!r.last&&canWrite)?`<div class="ask"><p>${t("lastQ")}</p><div class="qchips">${[0,3,7,14,30].map(d=>`<button class="qchip" data-past="${d}">${STR[LANG].ago[d]}</button>`).join("")}</div></div>`:"";
  const acts=canWrite?`${r.last?`<button class="big primary" data-buyone="${it.id}">${CHECK}${t("boughtToday")}</button>`:""}
    <button class="big second ${it.needed?"on":""}" data-need="${it.id}">${it.needed?t("onList"):t("ranOut")}</button>`:"";
  $("sheetIn").innerHTML=`
    <div class="sh-head">${icon(it)}<h3>${esc(nm(it))}</h3>${closeBtn()}</div>
    ${say}${ask}${acts}
    <details id="more"><summary>${t("details")}</summary><div class="more">
      <div class="stats">
        <div class="stat"><b class="num">${r.cycle?Math.round(r.cycle):"—"}</b><span>${t("statCycle")}${r.cycle?`（${r.learned?t("learned"):t("estimate")}）`:""}</span></div>
        <div class="stat"><b class="num">${r.next?fmtD(r.next):"—"}</b><span>${t("statNext")}</span></div>
        <div class="stat"><b class="num">${r.ps.length}</b><span>${t("statCount")}</span></div>
      </div>
      ${canWrite?`<div><label style="margin-bottom:6px">${t("logPast")}</label><div class="inline">
        <label>${t("dateBought")}<input type="date" id="sDate" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}"></label>
        <label>${t("qty")}<input type="number" id="sQty" min="1" max="99" value="1" inputmode="numeric"></label>
        <button class="small-btn" id="sBuy">${t("save")}</button></div></div>`:""}
      <div><label style="margin-bottom:4px">${t("history")}</label>
      ${hist.length?`<ul class="hist">${hist.map((p,i)=>{const prev=hist[i+1];const gap=prev?Math.round((p.at-prev.at)/DAY):null;
        return `<li><span class="num">${fmtFull(p.at)}</span><span class="m">${p.qty>1?`×${p.qty} · `:""}${esc(p.byName||"")}${gap!=null?t("gap",gap):""}</span>${canWrite?`<button class="x" data-delp="${p.id}">${t("del")}</button>`:"<span></span>"}</li>`}).join("")}</ul>`:`<p class="m" style="margin:0;color:var(--muted)">${t("noHist")}</p>`}</div>
      ${canWrite?`<div class="row2">
        <label>${t("estDays")}<input type="number" id="sGuess" min="1" max="365" value="${it.guessDays||""}" inputmode="numeric"></label>
        <label>${t("cat")}<select id="sCat">${CATS.map(c=>`<option value="${c}" ${c===(it.cat||"Other")?"selected":""}>${catName(c)}</option>`).join("")}</select></label>
      </div>
      <button class="danger" id="delBtn">${confirmDel?t("delConfirm"):t("delItem")}</button>`:""}
    </div></details>`;
}
function renderAdd(){
  const have=new Set(items.map(i=>i.name));
  $("sheetIn").innerHTML=`
    <div class="sh-head"><h3>${t("addT")}</h3>${closeBtn()}</div>
    <form id="addForm" autocomplete="off" style="display:flex;flex-direction:column;gap:14px">
      <label>${t("name")}<input id="fName" required maxlength="40" placeholder="${esc(t("namePh"))}"></label>
      <div><label style="margin-bottom:6px">${t("cat")}</label><div class="qchips">${CATS.map(c=>`<button type="button" class="qchip" data-addcat="${c}" aria-pressed="${addCat===c}">${catName(c)}</button>`).join("")}</div></div>
      <div><label style="margin-bottom:6px">${t("howLong")}</label><div class="qchips">${[7,14,30,60,90].map(d=>`<button type="button" class="qchip" data-adddays="${d}" aria-pressed="${addDays===d}">${STR[LANG].dayOpts[d]}</button>`).join("")}</div></div>
      <button class="big primary" type="submit">${t("addBtn")}</button>
    </form>
    <div><label style="margin-bottom:6px">${t("ideas")}</label><div class="qchips">${QUICK.filter(([n])=>!have.has(n)).map(([n,c,j])=>`<button class="qchip" data-quick="${esc(n)}" data-ja="${esc(j)}" data-qcat="${c}">＋${esc(LANG==="ja"?j:n)}</button>`).join("")}</div></div>`;
}
function renderMenu(){
  $("sheetIn").innerHTML=`
    <div class="sh-head"><h3>${t("menuT")}</h3>${closeBtn()}</div>
    <p class="say" style="font-size:14px">${esc(t("signedAs",meName))}</p>
    <div><label style="margin-bottom:6px">${t("language")}</label><div class="lang"><button data-lang="ja" aria-pressed="${LANG==="ja"}">日本語</button><button data-lang="en" aria-pressed="${LANG==="en"}">English</button></div></div>
    <button class="danger" id="logoutBtn" style="border-color:var(--line);color:var(--ink)">${t("logout")}</button>`;
}

/* ---- toast ---- */
let tTimer;
function toast(msg,undo){
  const el=$("toast");el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button id="undoBtn">${t("undo")}</button>`:""}`;el.hidden=false;
  if(undo)$("undoBtn").onclick=()=>{el.hidden=true;undo();};
  clearTimeout(tTimer);tTimer=setTimeout(()=>el.hidden=true,5000);
}
function fail(e){
  console.error("[HomeStock] write failed",e);
  const code=(e&&e.code)||"unknown";
  if(code==="permission-denied"){toast(t("errRO"));return;}
  toast(t("errSave")+" ("+code+")");
}
const TRANSIENT=new Set(["unavailable","deadline-exceeded","aborted","internal","unknown","cancelled"]);
async function withRetry(fn){
  try{return await fn();}
  catch(e){if(e&&TRANSIENT.has(e.code)){await new Promise(r=>setTimeout(r,1500));return await fn();}throw e;}
}

/* ---- 書き込み ---- */
async function buy(itemId,at=Date.now(),qty=1){
  if(!db)return;
  const it=items.find(i=>i.id===itemId);
  const ref=db.collection("purchases").doc();
  const prevNeed=it&&it.needed?{needed:true,neededBy:it.neededBy||null,neededByName:it.neededByName||""}:null;
  try{
    const saving=withRetry(()=>ref.set({itemId,at,qty,by:me||null,byName:meName||""}));
    if(prevNeed)withRetry(()=>db.doc("items/"+itemId).update({needed:false})).catch(fail);
    toast(t("logged",it?nm(it):""),()=>{ref.delete().catch(fail);if(prevNeed)db.doc("items/"+itemId).update(prevNeed).catch(fail);});
    await saving;
  }catch(e){fail(e)}
}
async function toggleNeed(itemId){
  const it=items.find(i=>i.id===itemId);if(!it||!db)return;
  const on=!it.needed;
  try{
    await withRetry(()=>db.doc("items/"+itemId).update(on?{needed:true,neededBy:me||null,neededByName:meName||"",neededAt:Date.now()}:{needed:false}));
    toast(on?t("listed",nm(it)):t("unlisted",nm(it)),()=>db.doc("items/"+itemId).update({needed:!on}).catch(fail));
  }catch(e){fail(e)}
}
async function addItem(name,cat,guess,nameJa){
  name=name.trim();if(!name||!db)return false;
  if(items.some(i=>i.name===name||i.nameJa===name)){toast(t("dup"));return false;}
  try{await withRetry(()=>db.collection("items").add({name,nameJa:nameJa||null,cat,guessDays:guess||null,needed:false,createdAt:Date.now(),by:me||null}));toast(t("added",LANG==="ja"&&nameJa?nameJa:name));return true;}
  catch(e){fail(e);return false;}
}

/* ---- 操作 ---- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");
  if(e.target.id==="scrim"){closeSheet();return;}
  if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;window.scrollTo(0,0);render();return;}
  if(d.lang){LANG=d.lang;try{localStorage.setItem("lang",LANG)}catch(_){};applyStaticLang();render();return;}
  if(d.close!==undefined){closeSheet();return;}
  if(d.tick){const row=b.closest(".lrow");row&&row.classList.add("done");const id=d.tick;setTimeout(()=>buy(id),320);return;}
  if(d.open){openSheet(d.open);return;}
  if(d.cat){catFilter=d.cat;render();return;}
  if(d.buyone){const id=d.buyone;closeSheet();buy(id);return;}
  if(d.need){const id=d.need;closeSheet();toggleNeed(id);return;}
  if(d.past!==undefined){const id=openId;const days=+d.past;closeSheet();buy(id,days?today0()-days*DAY+12*3600000:Date.now());return;}
  if(d.addcat){addCat=d.addcat;document.querySelectorAll("[data-addcat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.addcat===addCat));return;}
  if(d.adddays){addDays=+d.adddays;document.querySelectorAll("[data-adddays]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.adddays===addDays));return;}
  if(d.quick){if(await addItem(d.quick,d.qcat,null,d.ja))renderSheet();return;}
  if(d.delp){try{await db.doc("purchases/"+d.delp).delete();}catch(err){fail(err)}return;}
  if(b.id==="addBtn"){openSheet("__add");return;}
  if(b.id==="menuBtn"){openSheet("__menu");return;}
  if(b.id==="toStock"){tab="stock";window.scrollTo(0,0);render();return;}
  if(b.id==="logoutBtn"){closeSheet();authM.signOut(auth);return;}
  if(b.id==="sBuy"){
    const v=$("sDate").value;const q=Math.max(1,parseInt($("sQty").value)||1);let at=Date.now();
    if(v){const [y,m,dd]=v.split("-").map(Number);const dt=new Date(y,m-1,dd,12);if(dt.toDateString()!==new Date().toDateString())at=dt.getTime();}
    const id=openId;closeSheet();buy(id,at,q);return;
  }
  if(b.id==="delBtn"){
    if(!confirmDel){confirmDel=true;const more=$("more");renderSheet();$("more").open=true;return;}
    const id=openId,it=items.find(i=>i.id===id);closeSheet();
    try{for(const p of purchases.filter(p=>p.itemId===id))await db.doc("purchases/"+p.id).delete();await db.doc("items/"+id).delete();toast(t("deleted",it?nm(it):""));}
    catch(err){fail(err)}
  }
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  if(await addItem($("fName").value,addCat,addDays,null))closeSheet();
});
document.addEventListener("change",async e=>{
  if(!openId||!db||openId.startsWith("__"))return;
  if(e.target.id==="sGuess"){const v=parseInt(e.target.value)||null;try{await db.doc("items/"+openId).update({guessDays:v});}catch(err){fail(err)}}
  if(e.target.id==="sCat"){try{await db.doc("items/"+openId).update({cat:e.target.value});}catch(err){fail(err)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId)closeSheet();});

/* ---- Firebase ---- */
const SEED=[["cling-wrap","Cling wrap","クリングラップ","Kitchen",45],["toilet-paper","Toilet paper","トイレットペーパー","Bath & Toilet",14],
["diapers","Diapers","おむつ","Baby",7],["baby-wipes","Wet wipes","おしりふき","Baby",7],["formula-milk","Formula milk","粉ミルク","Baby",10],["baby-food","Baby food pouches","離乳食パウチ","Baby",7],["baby-wash","Baby shampoo & wash","ベビーシャンプー・ソープ","Baby",60],["diaper-cream","Diaper rash cream","おむつかぶれクリーム","Baby",60],["baby-detergent","Baby laundry detergent","ベビー用洗濯洗剤","Baby",45],["bottle-wash","Bottle & teat cleanser","哺乳瓶用洗剤","Baby",30],
["kitchen-paper","Kitchen paper towels","キッチンペーパー","Kitchen",14],["dish-soap","Dishwashing liquid","食器用洗剤","Kitchen",30],["garbage-bags","Garbage bags","ゴミ袋","Kitchen",30],["ziplock","Zip-lock bags","ジップロック","Kitchen",45],["foil","Aluminium foil","アルミホイル","Kitchen",90],["sponges","Sponges","スポンジ","Kitchen",30],
["tissues","Tissues","ティッシュ","Bath & Toilet",14],["shampoo","Shampoo","シャンプー","Bath & Toilet",45],["body-wash","Body wash","ボディソープ","Bath & Toilet",30],["toothpaste","Toothpaste","歯磨き粉","Bath & Toilet",30],["hand-soap","Hand soap","ハンドソープ","Bath & Toilet",30],
["laundry-detergent","Laundry detergent","洗濯洗剤","Laundry & Cleaning",30],["softener","Fabric softener","柔軟剤","Laundry & Cleaning",45],["surface-spray","Surface disinfectant spray","除菌スプレー","Laundry & Cleaning",45],
["rice","Rice","米","Food & Drink",30],["eggs","Eggs","卵","Food & Drink",7],["cooking-oil","Cooking oil","サラダ油","Food & Drink",45]];

const COL={items:"stock_items",purchases:"stock_purchases",config:"stock_config"};
let fs,fdb,auth,authM,unsubs=[];
function wrap(r){return{set:d=>fs.setDoc(r,d),update:d=>fs.updateDoc(r,d),delete:()=>fs.deleteDoc(r)};}
function makeDb(){
  return{
    collection(name){const col=fs.collection(fdb,COL[name]);return{
      doc(id){return wrap(id?fs.doc(col,id):fs.doc(col));},
      add(d){return fs.addDoc(col,d);},
      onSnapshot(next,err){return fs.onSnapshot(col,s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err);}
    };},
    doc(path){const [c,id]=path.split("/");return wrap(fs.doc(fdb,COL[c],id));}
  };
}
async function seedOnce(){
  const flag=fs.doc(fdb,COL.config,"seed");
  const f=await fs.getDoc(flag);
  if(f.exists())return;
  const b=fs.writeBatch(fdb);
  for(const [id,name,nameJa,cat,g] of SEED)b.set(fs.doc(fdb,COL.items,id),{name,nameJa,cat,guessDays:g,needed:false,createdAt:Date.now(),by:null});
  b.set(flag,{done:true,at:Date.now()});
  await b.commit();
}
function applyStaticLang(){document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll(".login [data-lang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===LANG));}
function showView(v){$("loginView").hidden=v!=="login";$("appView").hidden=v!=="app";applyStaticLang();}
function startData(u){
  me=u.uid;meName=u.displayName||(u.email||"").split("@")[0];
  db=makeDb();canWrite=true;$("ro").hidden=true;showView("app");render();
  const err=e=>{
    if(e&&e.code==="permission-denied"){canWrite=false;$("ro").textContent=t("noAccess");$("ro").hidden=false;render();return;}
    toast(t("syncStop"));
  };
  let migrated=false;
  unsubs.push(db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render();
    const w=items.find(i=>i.id==="baby-wipes");if(!migrated&&w&&w.name==="Baby wipes"){migrated=true;db.doc("items/baby-wipes").update({name:"Wet wipes"}).catch(()=>{});}
  },err));
  unsubs.push(db.collection("purchases").onSnapshot(s=>{purchases=s.docs.map(d=>({id:d.id,...d.data()}));render();},err));
  seedOnce().catch(()=>{});
}
function stopData(){unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];items=[];purchases=[];db=null;}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("lErr").hidden=true;
  try{await authM.signInWithEmailAndPassword(auth,$("lEmail").value.trim(),$("lPass").value);}
  catch(_){$("lErr").textContent=t("badLogin");$("lErr").hidden=false;}
});

(async()=>{
  applyStaticLang();
  const [appM,aM,fM]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);
  authM=aM;fs=fM;
  const app=appM.initializeApp(firebaseConfig);
  auth=aM.getAuth(app);
  await aM.setPersistence(auth,aM.indexedDBLocalPersistence).catch(()=>{});
  // もぐもぐはるきと同じサイト・同じFirebaseなので、端末内の保存領域を共有しないようメモリキャッシュにする
  try{fdb=fM.initializeFirestore(app,{localCache:fM.memoryLocalCache()});}catch(_){fdb=fM.getFirestore(app);}
  aM.onAuthStateChanged(auth,u=>{
    stopData();
    if(!u){showView("login");return;}
    if(!u.emailVerified){showView("login");$("lErr").textContent=t("notVerified");$("lErr").hidden=false;return;}
    startData(u);
  });
  setInterval(()=>{if(!openId&&db)render();},60*60*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db&&!openId)render();});
})();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>{document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{}));
}
